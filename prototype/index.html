<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Employee Equipment Request & Approval Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">LOCAL BUSINESS-RULE PROTOTYPE</p>
        <h1>Employee Equipment Request & Approval Hub</h1>
        <p id="identity"></p>
      </div>
      <label>Role
        <select id="role">
          <option>Employee</option>
          <option>Manager</option>
          <option>IT</option>
        </select>
      </label>
    </header>

    <section id="new-request-panel" class="card">
      <h2>New request</h2>
      <form id="request-form">
        <div class="grid">
          <label>Title<input name="title" required></label>
          <label>Department
            <select name="department" required>
              <option value="">Choose</option>
              <option>Engineering</option><option>Finance</option><option>HR</option>
              <option>Marketing</option><option>Operations</option><option>Sales</option>
            </select>
          </label>
          <label>Device type
            <select name="deviceType" required>
              <option value="">Choose</option>
              <option>Laptop</option><option>Monitor</option><option>Keyboard</option>
              <option>Mouse</option><option>Headset</option><option>Docking Station</option>
            </select>
          </label>
          <label>Urgency
            <select name="urgency" required>
              <option>Normal</option><option>Low</option><option>High</option><option>Critical</option>
            </select>
          </label>
        </div>
        <label>Reason<textarea name="requestReason" minlength="10" required></textarea></label>
        <button type="submit">Submit request</button>
        <p id="status" class="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Role queue</h2>
      <table>
        <thead><tr><th>Request</th><th>Device</th><th>Approval</th><th>Fulfillment</th><th>Actions</th></tr></thead>
        <tbody id="request-rows"></tbody>
      </table>
      <p class="note">The cloud implementation uses SharePoint + Power Automate. This local UI validates the same business-state transitions without claiming a tenant deployment.</p>
    </section>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
